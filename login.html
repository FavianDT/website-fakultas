<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Sistem Informasi</title>

    <link rel="stylesheet" href="stylelogin.css">
</head>

<body>
    <main class="login-page">

        <div class="login-background"></div>
        <section class="login-container">
            <div class="login-card">
                <div class="login-form-section">
                    <div class="brand">
                        <a href="#" class="brand-logo">
                            <img src="logo.png" alt="Logo">
                        </a>
                    </div>

                    <div class="form-header">
                        <h1>Selamat Datang!</h1>
                        <p>Silakan masuk untuk melanjutkan</p>
                    </div>

                    <form id="loginForm" class="login-form">
                        <div class="form-group">
                            <label for="username">
                                Username
                            </label>

                            <div class="input-wrapper">
                                <input
                                    type="text"
                                    id="username"
                                    name="username"
                                    placeholder="Masukkan username"
                                    autocomplete="username"
                                    required
                                >

                            </div>
                        </div>

                        <div class="form-group">
                            <label for="password">
                                Password
                            </label>
                            <div class="input-wrapper">
                                <input
                                    type="password"
                                    id="password"
                                    name="password"
                                    placeholder="Masukkan password"
                                    autocomplete="current-password"
                                    required
                                >
                                <button
                                    type="button"
                                    class="password-toggle"
                                    id="passwordToggle"
                                    aria-label="Tampilkan password"
                                >
                                    <span class="eye-icon">👁</span>
                                </button>
                            </div>
                        </div>

                        <div class="form-options">
                            <a
                                href="#"
                                class="forgot-password"
                                id="forgotPassword"
                            >
                                Lupa Password?
                            </a>
                        </div>

                        <button
                            type="submit"
                            class="btn-login"
                        >
                            <span>Sign In</span>
                        </button>
                    </form>

                    <div class="divider">
                        <span>atau masuk dengan</span>
                    </div>

                    <button
                        type="button"
                        class="google-login"
                        id="googleLogin"
                    >
                        <span class="google-icon">G</span>
                        <span>Google</span>
                    </button>

                    <p class="mobile-register">
                        Belum memiliki akun?
                        <a href="register.html">
                            Daftar sekarang
                        </a>
                    </p>
                </div>


                <div class="register-section">
                    <div class="register-content">
                        <div class="register-header">
                            <span class="register-badge">
                                AKUN BARU
                            </span>
                            <h2>Halo, Teman!</h2>
                            <p>
                                Daftarkan diri Anda dan mulai
                                menggunakan layanan kami.
                            </p>
                        </div>

                        <a
                            href="register.html"
                            class="btn-register"
                        >
                            <span>Sign Up</span>
                        </a>

                        <div class="register-decoration">
                            <div class="decoration-circle circle-one"></div>
                            <div class="decoration-circle circle-two"></div>
                            <div class="decoration-circle circle-three"></div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script>
        const loginForm =
            document.getElementById("loginForm");
        const usernameInput =
            document.getElementById("username");
        const passwordInput =
            document.getElementById("password");
        const passwordToggle =
            document.getElementById("passwordToggle");
        const forgotPassword =
            document.getElementById("forgotPassword");
        const googleLogin =
            document.getElementById("googleLogin");

        passwordToggle.addEventListener(
            "click",
            function () {
                if (passwordInput.type === "password") {
                    passwordInput.type = "text";
                    passwordToggle.classList.add("active");
                    passwordToggle.setAttribute(
                        "aria-label",
                        "Sembunyikan password"
                    );
                } else {
                    passwordInput.type = "password";
                    passwordToggle.classList.remove("active");
                    passwordToggle.setAttribute(
                        "aria-label",
                        "Tampilkan password"
                    );
                }
            }
        );

        loginForm.addEventListener(
            "submit",
            function (event) {
                event.preventDefault();
                const username =
                    usernameInput.value.trim();
                const password =
                    passwordInput.value;

                if (
                    username === "admin" &&
                    password === "admin123"
                ) {
                    window.location.href =
                        "home-admin.html";
                    return;
                }

                if (
                    username === "user" &&
                    password === "user123"
                ) {
                    window.location.href =
                        "home.html";
                    return;
                }

                alert(
                    "Username atau password salah."
                );
                passwordInput.value = "";
                passwordInput.focus();
            }
        );

        forgotPassword.addEventListener(
            "click",
            function (event) {
                event.preventDefault();
                alert(
                    "Fitur lupa password belum tersedia pada versi demo."
                );
            }
        );

        googleLogin.addEventListener(
            "click",
            function () {
                alert(
                    "Login Google belum tersedia pada versi demo."
                );
            }
        );
    </script>
</body>
</html>
