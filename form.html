<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Template Navbar & Footer</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Font Awesome CDN untuk Ikon -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="styleform.css">

</head>
<body>

    <!-- NAVBAR -->
    <header class="navbar">
        <div class="navbar-brand">
            <!-- Ganti src dengan path logo Anda -->
            <img src="logo.png" alt="FTP UNINUS Logo">
        </div>
        <div class="navbar-actions">
            <div class="notification-icon">
                <i class="fa-solid fa-bell"></i>
            </div>
            <div class="theme-toggle">
                <div class="toggle-circle"></div>
            </div>
        </div>
    </header>


    <!-- TEMPAT UNTUK ANGGOTA TIM LAIN -->
    <main class="main-content">
        <div class="form-wrapper">

            <div class="title">
                Permohonan Keterangan Aktif FTP Uninus
            </div>

            <div class="form">

                <!-- NAMA -->
                <div class="form-card">
                    <label>Nama Mahasiswa</label>

                    <input 
                        type="text"
                        placeholder="Ketik Nama Lengkap">
                </div>

                <!-- NIM -->
                <div class="form-card">
                    <label>Nomor Induk Mahasiswa</label>

                    <input
                        type="text"
                        placeholder="Ketik NIM"> 
                </div>

                <!-- PRODI -->
                <div class="form-card">
                    <label>Program Studi</label>

                    <select>
                        <option value="">
                            Pilih Prodi
                        </option>
                        <option>
                            Agroteknologi
                        </option>
                        <option>
                            Teknik Elektro 
                        </option>
                        <option>
                            Teknik Industri
                        </option>
                        <option>
                            Teknik Informatika
                        </option>
                    </select>
                </div>

                <!-- SEMESTER -->
                <div class="form-card">
                    <label>Semester</label>

                    <select>
                        <option value="">
                            Pilih Semester
                        </option>
                        <option>
                            Semester 1
                        </option>
                        <option>
                            Semester 2
                        </option>
                        <option>
                            Semester 3
                        </option>
                        <option>
                            Semester 4
                        </option>
                        <option>
                            Semester 5
                        </option>
                        <option>
                            Semester 6
                        </option>
                        <option>
                            Semester 7
                        </option>
                        <option>
                            Semester 8
                        </option>
                    </select>
                </div>

                <!-- TTL -->
                <div class="form-card">
                    <label>Tempat, Tanggal Lahir</label>

                    <input 
                        type="text"
                        placeholder="Contoh: Tangerang, 4 Maret 2001">
                </div>

                <!-- ALAMAT -->
                <div class="form-card">
                    <label>Alamat Lengkap</label>

                    <input
                        type="text"
                        placeholder="Ketik Alamat">
                </div>

                <!-- NOMOR HP -->
                <div class="form-card">
                    <label>Nomor HP</label>

                    <input
                        type="text"
                        placeholder="Ketik Nomor HP">
                </div>

                <!-- KEPERLUAN SURAT -->
                <div class="form-card">
                    <label>Keperluan SUrat</label>

                    <input
                        type="text"
                        placeholder="Contoh: Untuk magang PMMB BUMN batch 1 2021, Diminta kantor orang tua, dll">
                </div>
            </div>
        </div>

        <div class="submit">
            <button class="btn btn-primary" type="submit">SUBMIT FORM</button>
        </div>
    </main>


    <!-- FOOTER -->
    <footer class="footer">
        <!-- Sisi Kiri Footer -->
        <div class="footer-left">
            <div class="brand-title">
                <i class="fa-solid fa-graduation-cap"></i>
                <span>Universitas Islam Nusantara</span>
            </div>
            <div class="social-icons">
                <a href="#"><i class="fa-brands fa-instagram"></i></a>
                <a href="#"><i class="fa-brands fa-tiktok"></i></a>
                <a href="#"><i class="fa-brands fa-facebook-f"></i></a>
                <a href="#"><i class="fa-brands fa-youtube"></i></a>
            </div>
        </div>

        <!-- Sisi Kanan Footer -->
        <div class="footer-right">
            <div class="info-item">
                <i class="fa-solid fa-envelope"></i>
                <a href="mailto:fakultas@gmail.com">fakultas@gmail.com</a>
            </div>
            <div class="info-item">
                <i class="fa-solid fa-location-dot"></i>
                <span>Jalan Soekarno-Hatta Nomor 530,<br>Buahbatu, Bandung</span>
            </div>
            <div class="info-item">
                <i class="fa-solid fa-phone"></i>
                <span>(022) 2100098</span>
            </div>
            <div class="info-item">
                <i class="fa-brands fa-whatsapp"></i>
                <span>081234566777</span>
            </div>
        </div>
    </footer>
</body>
</html>
