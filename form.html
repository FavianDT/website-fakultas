<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Permohonan Keterangan Aktif - FTP UNINUS</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="styleform.css">
    <link rel="stylesheet" href="site-shell.css">

</head>
<body>

    <header class="navbar">
        <div class="navbar-brand">
             <a href="home.html"><img src="logo.jpeg" alt="FTP UNINUS Logo"></a>
        </div>
        <div class="navbar-actions">
            <div class="notification-icon">
                <i class="fa-solid fa-bell"></i>
            </div>
            <div class="theme-toggle">
                <div class="toggle-circle"></div>
            </div>
        </div>
    </header>


    <main class="main-content">
        <form id="applicationForm" novalidate>
        <div class="form-wrapper">

            <div class="title">
                Permohonan dan Pengajuan FTP UNINUS
            </div>

            <div class="form">

                <div class="form-card">
                    <label for="studentName">Nama Mahasiswa</label>

                    <input 
                        id="studentName"
                        name="studentName"
                        type="text"
                        required
                        placeholder="Ketik Nama Lengkap">
                </div>

                <div class="form-card">
                    <label for="studentId">Nomor Induk Mahasiswa</label>

                    <input
                        id="studentId"
                        name="studentId"
                        type="text"
                        required
                        placeholder="Ketik NIM"> 
                </div>

                <div class="form-card">
                    <label for="studyProgram">Program Studi</label>

                    <select id="studyProgram" name="studyProgram" required>
                        <option value="">
                            Pilih Prodi
                        </option>
                        <option>
                            Agroteknologi
                        </option>
                        <option>
                            Teknik Elektro 
                        </option>
                        <option>
                            Teknik Industri
                        </option>
                        <option>
                            Teknik Informatika
                        </option>
                    </select>
                </div>

                <div class="form-card">
                    <label for="semester">Semester</label>

                    <select id="semester" name="semester" required>
                        <option value="">
                            Pilih Semester
                        </option>
                        <option>
                            Semester 1
                        </option>
                        <option>
                            Semester 2
                        </option>
                        <option>
                            Semester 3
                        </option>
                        <option>
                            Semester 4
                        </option>
                        <option>
                            Semester 5
                        </option>
                        <option>
                            Semester 6
                        </option>
                        <option>
                            Semester 7
                        </option>
                        <option>
                            Semester 8
                        </option>
                    </select>
                </div>

                <div class="form-card">
                    <label for="birthDetails">Tempat, Tanggal Lahir</label>

                    <input 
                        id="birthDetails"
                        name="birthDetails"
                        type="text"
                        required
                        placeholder="Contoh: Tangerang, 4 Maret 2001">
                </div>

                <div class="form-card">
                    <label for="address">Alamat Lengkap</label>

                    <input
                        id="address"
                        name="address"
                        type="text"
                        required
                        placeholder="Ketik Alamat">
                </div>

                <div class="form-card">
                    <label for="phone">Nomor HP</label>

                    <input
                        id="phone"
                        name="phone"
                        type="tel"
                        required
                        placeholder="Ketik Nomor HP">
                </div>

                <div class="form-card">
                    <label for="purpose">Keperluan Surat</label>

                    <input
                        id="purpose"
                        name="purpose"
                        type="text"
                        required
                        placeholder="Contoh: Untuk magang PMMB BUMN batch 1 2021, Diminta kantor orang tua, dll">
                </div>
            </div>
        </div>

        <div class="submit">
            <button class="btn btn-primary" type="submit">SUBMIT FORM</button>
        </div>
        </form>
    </main>


    <footer class="footer">
        <div class="footer-left">
            <div class="brand-title">
                <i class="fa-solid fa-graduation-cap"></i>
                <span>Universitas Islam Nusantara</span>
            </div>
            <div class="social-icons">
                <span class="social-link" aria-label="Instagram belum tersedia"><i class="fa-brands fa-instagram"></i></span>
                <span class="social-link" aria-label="TikTok belum tersedia"><i class="fa-brands fa-tiktok"></i></span>
                <span class="social-link" aria-label="Facebook belum tersedia"><i class="fa-brands fa-facebook-f"></i></span>
                <span class="social-link" aria-label="YouTube belum tersedia"><i class="fa-brands fa-youtube"></i></span>
            </div>
        </div>

        <div class="footer-right">
            <div class="info-item">
                <i class="fa-solid fa-envelope"></i>
                <a href="mailto:fakultas@gmail.com">fakultas@gmail.com</a>
            </div>
            <div class="info-item">
                <i class="fa-solid fa-location-dot"></i>
                <span>Jalan Soekarno-Hatta Nomor 530,<br>Buahbatu, Bandung</span>
            </div>
            <div class="info-item">
                <i class="fa-solid fa-phone"></i>
                <span>(022) 2100098</span>
            </div>
            <div class="info-item">
                <i class="fa-brands fa-whatsapp"></i>
                <span>081234566777</span>
            </div>
        </div>
    </footer>
    <script src="site.js"></script>
    <script src="form.js"></script>
</body>
</html>
